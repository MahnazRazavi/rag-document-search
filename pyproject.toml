[project]
name = "rag-document-search"
version = "0.1.0"
description = "RAG document search application"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "alembic>=1.18.5",
    "fastapi>=0.140.0",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.1.0",
    "pre-commit>=4.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "ruff>=0.11.13",
    "sentence-transformers>=5.6.1",
    "sqlalchemy>=2.0.51",
    "torch>=2.13.0",
    "uvicorn>=0.51.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
